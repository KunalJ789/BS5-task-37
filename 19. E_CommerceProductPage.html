<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>19. E-Commerce Product Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Store</a>

            <button class="btn btn-light">
                Cart
            </button>
        </div>
    </nav>


    <div class="container mt-4">

        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="#">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="#">Products</a>
                </li>
                <li class="breadcrumb-item active">
                    Shoes
                </li>
            </ol>
        </nav>


        <div class="row mt-4">


            <div class="col-md-6 text-center">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" class="img-fluid rounded"
                    alt="Shoes">
            </div>



            <div class="col-md-6">

                <h2>Running Shoes</h2>

                <p class="text-muted">
                    Comfortable shoes for running and everyday use.
                </p>

                <h3>₹1,999</h3>
                <span class="badge bg-success">
                    ★ 4.5
                </span>

                <span class="badge bg-secondary">
                    120 Reviews
                </span>

                <hr>

                <label class="form-label">Quantity</label>

                <input type="number" class="form-control w-25" value="1" min="1">

                <button class="btn btn-primary mt-3">
                    Add to Cart
                </button>

            </div>

        </div>


        <h3 class="mt-5 mb-3">Related Products</h3>

        <div class="row g-3">

            <div class="col-md-4">
                <div class="card" >
                    <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77" class="card-img-top"
                        alt="Shoes">

                    <div class="card-body">
                        <h5 class="card-title">Casual Shoes</h5>
                        <p>₹1,499</p>
                        <button class="btn btn-primary">
                            View Product
                        </button>
                    </div>
                </div>
            </div>


            <div class="col-md-4">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519" class="card-img-top"
                        alt="Shoes">

                    <div class="card-body">
                        <h5 class="card-title">Sports Shoes</h5>
                        <p>₹1,799</p>
                        <button class="btn btn-primary">
                            View Product
                        </button>
                    </div>
                </div>
            </div>


            <div class="col-md-4">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3" class="card-img-top"
                        alt="Shoes">

                    <div class="card-body">
                        <h5 class="card-title">Sneakers</h5>
                        <p>₹2,299</p>
                        <button class="btn btn-primary">
                            View Product
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
